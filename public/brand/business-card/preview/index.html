<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Niall Tech — Business card preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #F7F9FC; color: #0B1320; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: #475569; line-height: 1.5; }
    .grid { display: grid; gap: 28px; margin-top: 28px; }
    @media (min-width: 800px) { .grid { grid-template-columns: 1fr 1fr; } }
    figure { margin: 0; }
    figcaption { font-weight: 600; margin-bottom: 8px; }
    img { width: 100%; height: auto; border-radius: 8px; box-shadow: 0 12px 40px -24px rgba(15,23,42,.45); background: #0B1320; }
    .rec { color: #146BFF; font-size: .85rem; }
    .meta { font-size: .9rem; }
    code { background: #E5E7EB; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Niall Tech business card preview</h1>
    <p class="meta">Finished <code>3.5" × 2"</code> · Full bleed <code>3.75" × 2.25"</code> · QR → <code>https://nialltech.com/connect</code></p>
    <p>Recommended back: <strong>Variant A</strong>. Print <code>business-card-preview.pdf</code> at 100% scale for an actual-size check before VistaPrint ordering.</p>
    <div class="grid">
      <figure>
        <figcaption>Front</figcaption>
        <img src="../exports/niall-tech-business-card-front.png" alt="Business card front"/>
      </figure>
      <figure>
        <figcaption>Back — Variant A <span class="rec">Recommended</span></figcaption>
        <img src="../concepts/back-variant-a.png" alt="Back variant A"/>
      </figure>
      <figure>
        <figcaption>Back — Variant B </figcaption>
        <img src="../concepts/back-variant-b.png" alt="Back variant B"/>
      </figure>
      <figure>
        <figcaption>Back — Variant C </figcaption>
        <img src="../concepts/back-variant-c.png" alt="Back variant C"/>
      </figure>
    </div>
  </main>
</body>
</html>
